<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="vvGoldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#6B4E00" />
    </linearGradient>

    <linearGradient id="vvGoldGleam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="35%" stop-color="#FDF3CD" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#7A5600" />
    </linearGradient>

    <linearGradient id="vvGoldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#684700" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#FFF6D6" />
    </linearGradient>

    <!-- Deep Royal Navy Gradients -->
    <linearGradient id="vvNavyDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12336D" />
      <stop offset="40%" stop-color="#0A1D3F" />
      <stop offset="100%" stop-color="#040C1A" />
    </linearGradient>

    <linearGradient id="vvNavyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4796" />
      <stop offset="50%" stop-color="#0F2B5C" />
      <stop offset="100%" stop-color="#061329" />
    </linearGradient>

    <!-- Wordmark Navy Gradient with Gold Luster -->
    <linearGradient id="vvWordmarkNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4E9E" />
      <stop offset="40%" stop-color="#10326B" />
      <stop offset="100%" stop-color="#091C3E" />
    </linearGradient>

    <!-- Lens Aperture Radial Gradient -->
    <radialGradient id="vvLensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D478A" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0A2046" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030A17" />
    </radialGradient>

    <!-- Drop Shadows for 3D Depth -->
    <filter id="vvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. ICON EMBLEM (MONOGRAM + APERTURE + ORBIT)                           -->
  <!-- ===================================================================== -->
  <g transform="translate(100, 10)">
    <!-- Background Orbit (Back Arc) -->
    <path d="M 80,280 C 60,225 140,145 300,95 C 460,45 560,80 580,125"
          fill="none" stroke="url(#vvGoldGleam)" stroke-width="7" stroke-linecap="round" opacity="0.65" />

    <!-- Central Camera Aperture / Lens Sphere -->
    <g transform="translate(300, 180)" filter="url(#vvShadow)">
      <circle cx="0" cy="0" r="95" fill="none" stroke="url(#vvGoldMain)" stroke-width="8.5" />
      <circle cx="0" cy="0" r="88" fill="url(#vvLensGlow)" />

      <!-- Curved Aperture Shutter Blades -->
      <path d="M 0,-88 A 88,88 0 0,1 76,-44 L 20,-11 Z" fill="#0E2752" stroke="url(#vvGoldBevel)" stroke-width="2.5" />
      <path d="M 76,-44 A 88,88 0 0,1 76,44 L 11,20 Z" fill="#0B2044" stroke="url(#vvGoldBevel)" stroke-width="2.5" />
      <path d="M 76,44 A 88,88 0 0,1 0,88 L -20,11 Z" fill="#081834" stroke="url(#vvGoldBevel)" stroke-width="2.5" />
      <path d="M 0,88 A 88,88 0 0,1 -76,44 L -11,-20 Z" fill="#0B2044" stroke="url(#vvGoldBevel)" stroke-width="2.5" />
      <path d="M -76,44 A 88,88 0 0,1 -76,-44 L 20,-11 Z" fill="#0E2752" stroke="url(#vvGoldBevel)" stroke-width="2.5" />
      <path d="M -76,-44 A 88,88 0 0,1 0,-88 L -11,20 Z" fill="#123164" stroke="url(#vvGoldBevel)" stroke-width="2.5" />

      <!-- Inner Aperture Ring -->
      <circle cx="0" cy="0" r="38" fill="#051022" stroke="url(#vvGoldMain)" stroke-width="3" />

      <!-- 3D Metallic Gold Play Button -->
      <polygon points="-11,-20 22,0 -11,20" fill="url(#vvGoldMain)" stroke="url(#vvGoldBevel)" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Interlocking 3D "VV" Monogram -->
    <g filter="url(#vvShadow)">
      <!-- Left V Gold Bevel/Base -->
      <path d="M 100,100 L 195,100 L 255,250 L 315,100 L 410,100 L 290,340 L 220,340 Z"
            fill="url(#vvGoldMain)" stroke="url(#vvGoldBevel)" stroke-width="4" stroke-linejoin="round" />
      <!-- Left V Navy Core -->
      <path d="M 118,111 L 182,111 L 255,270 L 328,111 L 392,111 L 285,326 L 225,326 Z"
            fill="url(#vvNavyDeep)" />
      <!-- Left V Highlight -->
      <path d="M 118,111 L 150,111 L 235,295 L 225,326 Z" fill="url(#vvNavyFacet)" opacity="0.6" />

      <!-- Right V Gold Bevel -->
      <path d="M 225,128 L 305,128 L 375,282 L 445,128 L 525,128 L 405,365 L 345,365 Z"
            fill="url(#vvGoldMain)" stroke="url(#vvGoldBevel)" stroke-width="4.5" stroke-linejoin="round" />
      <!-- Right V Navy Core -->
      <path d="M 240,139 L 295,139 L 375,302 L 455,139 L 510,139 L 400,351 L 350,351 Z"
            fill="url(#vvNavyFacet)" />
      <!-- Right V Shadow -->
      <path d="M 240,139 L 270,139 L 360,320 L 350,351 Z" fill="#040D1D" opacity="0.75" />
    </g>

    <!-- Dynamic Orbital Ring (Front Swoop) -->
    <path d="M 110,295 C 130,350 240,390 370,360 C 470,335 540,275 580,220 C 600,190 595,155 560,145 C 530,135 490,155 440,185"
          fill="none" stroke="url(#vvGoldMain)" stroke-width="11" stroke-linecap="round" filter="url(#vvShadow)" />
    <path d="M 110,295 C 130,350 240,390 370,360 C 470,335 540,275 580,220 C 600,190 595,155 560,145 C 530,135 490,155 440,185"
          fill="none" stroke="url(#vvGoldGleam)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- ===================================================================== -->
  <!-- 2. BRAND WORDMARK: "VIJAY VISUALS"                                     -->
  <!-- ===================================================================== -->
  <g transform="translate(400, 490)" text-anchor="middle" filter="url(#vvShadow)">
    <text font-family="'Plus Jakarta Sans', 'Cinzel', 'Montserrat', sans-serif"
          font-weight="900" font-size="76" letter-spacing="12">
      <!-- "VIJAY" in Royal Navy with Gold Contour -->
      <tspan fill="url(#vvWordmarkNavy)" stroke="url(#vvGoldBevel)" stroke-width="1.8" dx="-20">VIJAY</tspan>
      <!-- Space -->
      <tspan fill="none"> </tspan>
      <!-- "VISUALS" in Gleaming 3D Gold -->
      <tspan fill="url(#vvGoldMain)" stroke="url(#vvGoldBevel)" stroke-width="1.8" dx="20">VISUALS</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="50" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="600" font-size="16" letter-spacing="14"
          fill="#D4AF37" opacity="0.9">
      AUTONOMOUS COMMERCE OPERATING SYSTEM
    </text>
    <text y="78" font-family="'Plus Jakarta Sans', sans-serif"
          font-weight="500" font-size="13" letter-spacing="8"
          fill="#8E99AC" opacity="0.8">
      MADE IN INDIA · BUILT FOR THE WORLD
    </text>
  </g>
</svg>
