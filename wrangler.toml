name = "vijay-visuals-site"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

# Cloudflare Pages Preview Environment (Branch: master and preview deployments)
# Bound to isolated Preview D1 database: vijay-visuals-preview
[[d1_databases]]
binding = "DB"
database_name = "vijay-visuals-preview"
database_id = "04ebaf6a-ff38-445c-889d-1fb391548a41"
migrations_dir = "cloudflare/d1/migrations"

# Cloudflare Pages Production Environment (Branch: main - strictly untouched)
# Bound to original Production D1 database: vijay-visuals-marketplace
[[env.production.d1_databases]]
binding = "DB"
database_name = "vijay-visuals-marketplace"
database_id = "5e6c67d1-ccc0-4e98-a787-c6643e9f0f6c"
migrations_dir = "cloudflare/d1/migrations"
